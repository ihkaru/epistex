<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 84" width="540" height="84" fill="none">
  <!-- Gnosidex Wordmark (Light Mode: for light backgrounds) -->
  <defs>
    <linearGradient id="g-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Emblem: Faceted Geometric Codex & Knowledge Core -->
  <g transform="translate(10, 10)">
    <!-- Base diamond / shield -->
    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#g-grad)" opacity="0.12"/>
    <rect x="4" y="4" width="56" height="56" rx="16" stroke="url(#g-grad)" stroke-width="2"/>
    
    <!-- Central G-monogram & Hexagonal node core -->
    <path d="M42 24C40 21 36 19 32 19C24.8 19 19 24.8 19 32C19 39.2 24.8 45 32 45C38.5 45 43 40.5 44 35H32" 
          stroke="url(#g-grad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Active node dot -->
    <circle cx="44" cy="24" r="3" fill="#06b6d4"/>
    <circle cx="32" cy="32" r="2.5" fill="#4f46e5"/>
  </g>

  <!-- Wordmark Typography -->
  <text x="82" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#0f172a">
    Gnosidex
  </text>

  <!-- Pill Badge: Enterprise Agent Substrate -->
  <rect x="238" y="24" width="94" height="24" rx="12" fill="url(#accent-grad)" opacity="0.12"/>
  <text x="285" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#4f46e5" text-anchor="middle">
    AGENT-FIRST
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="83" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="0.2" fill="#64748b">
    Git-Based Knowledge Base Starter Kit • Hermetic Secret Injection
  </text>
</svg>

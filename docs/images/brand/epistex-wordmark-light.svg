<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 84" width="540" height="84" fill="none">
  <!-- Epistex Wordmark (Dark Mode: for dark backgrounds) -->
  <defs>
    <linearGradient id="ep-grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="accent-pill-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <!-- Emblem: The Epistemic Prism & Pillar (E-Monogram Architecture) -->
  <g transform="translate(10, 10)">
    <!-- Base geometric container -->
    <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#ep-grad-dark)" opacity="0.15"/>
    <rect x="4" y="4" width="56" height="56" rx="16" stroke="url(#ep-grad-dark)" stroke-width="2"/>
    
    <!-- Stylized Epistemic 'E' with three tiered knowledge pillars -->
    <!-- Vertical spine -->
    <path d="M22 20V44" stroke="url(#ep-grad-dark)" stroke-width="4.5" stroke-linecap="round"/>
    <!-- Top bar -->
    <path d="M22 20H42" stroke="url(#ep-grad-dark)" stroke-width="4" stroke-linecap="round"/>
    <!-- Middle bar with illuminated node -->
    <path d="M22 32H36" stroke="url(#ep-grad-dark)" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Bottom bar -->
    <path d="M22 44H42" stroke="url(#ep-grad-dark)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Illuminated Epistemic nodes -->
    <circle cx="42" cy="20" r="3" fill="#22d3ee"/>
    <circle cx="36" cy="32" r="2.5" fill="#818cf8"/>
    <circle cx="42" cy="44" r="3" fill="#60a5fa"/>
  </g>

  <!-- Wordmark Typography -->
  <text x="82" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5" fill="#f8fafc">
    Epistex
  </text>

  <!-- Pill Badge: Enterprise Agent Substrate -->
  <rect x="228" y="24" width="94" height="24" rx="12" fill="url(#accent-pill-dark)" opacity="0.25"/>
  <text x="275" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="0.5" fill="#93c5fd" text-anchor="middle">
    AGENT-FIRST
  </text>
  
  <!-- Subtitle Tagline -->
  <text x="83" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="12" font-weight="500" letter-spacing="0.2" fill="#94a3b8">
    Git-Based Knowledge Base Starter Kit • Hermetic Secret Injection
  </text>
</svg>
